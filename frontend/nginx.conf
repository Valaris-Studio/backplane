server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # API proxy — forward to backend Cloud Run service
    # BACKEND_URL is injected via envsubst at container startup
    location /api/ {
        # Match the local-storage API's 25 MiB upload cap.
        client_max_body_size 25m;
        proxy_pass ${BACKEND_URL}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloud Run strips the Google-reserved IAP JWT header on the next hop;
        # re-send it under a non-reserved name the backend also accepts.
        proxy_set_header X-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
    }

    # WebSocket proxy — backend exposes /ws/workspaces/{slug}/events
    # HTTP/1.1 + Upgrade headers are required for WebSocket handshake.
    location /ws/ {
        proxy_pass ${BACKEND_URL}/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-IAP-JWT-Assertion $http_x_goog_iap_jwt_assertion;
        # Allow long-lived WS connections without idle timeout.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Hashed assets — cache forever
    location /assets/ {
        try_files $uri @retained_asset;
        error_page 404 = @missing_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @retained_asset {
        root /var/lib/backplane/frontend;
        try_files $uri =404;
        error_page 404 = @missing_asset;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location ~ /\. {
        return 404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
