name: Quickstart gate

# Required checks must run on eligible push/PR events: workflow_dispatch jobs
# alone do not satisfy branch protection, even when their commit is green.
# Release staging pushes qualify the exact commit before promotion to main.
# Keep nightly and manual runs available for additional cold-install checks.
#
# GitHub-hosted runners are cache-cold by construction (no prior `docker
# compose up` on the machine, no populated named volumes), which is exactly
# what makes this job the authoritative cold-clone run. A local
# `make quickstart-gate` gets fresh VOLUMES too (via the script's unique
# COMPOSE_PROJECT_NAME) but may still reuse cached Docker image layers on a
# dev machine; this job has neither.
on:
  push:
    branches: [main, 'codex/preview-*']
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quickstart-gate:
    name: Fresh-clone Quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Quickstart gate
        run: ./scripts/quickstart-gate.sh
