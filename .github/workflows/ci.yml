name: CI

# Public, GCP-free quality gates. Mirrors (and exceeds) the private
# cloudbuild.yaml gates so external contributors get the same signal without
# any cloud credentials. cloudbuild.yaml stays deploy-only.
on:
  push:
    branches: [main, 'codex/preview-*']
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job is guarded to the public repo: Actions must never run on the private
# source repo. A guarded-off job reports "skipped" (not absent), so the public
# repo's required-check names are unchanged.
jobs:
  backend:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Backend — pytest + ruff
    runs-on: ubuntu-latest
    # Measured 2026-09-02: -n 4 on ubuntu-latest exceeds 20 min (run 33604721558
    # was cancelled mid-suite). Generous cap until the suite is timed and split.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Audit dependencies
        working-directory: backend
        run: python -m pip_audit --strict
      - name: Install public-export gate tools
        # tests/test_public_export_snapshot_identity.py runs the real export
        # (git-filter-repo rewrite + gitleaks acceptance) into a temp dir and
        # SKIPS without them — a silent skip would hide identity/crash regressions.
        run: |
          pip install git-filter-repo
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          git-filter-repo --version && gitleaks version
      - name: Lint
        working-directory: backend
        run: ruff check app/
      - name: Tests
        working-directory: backend
        # Worker count pinned to 4, matching cloudbuild: -n auto spawns one
        # worker per core and each loads the full app, which has OOM-killed
        # workers mid-run and surfaced as a crash on a random unrelated test.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -n 4 -m "not slow" -p no:cacheprovider --tb=short -q

  mcp-server:
    if: github.repository == 'Valaris-Studio/backplane'
    name: MCP server — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # Install from uv.lock, never from ranges: CI must test the exact
      # resolution the lock ships, otherwise the lock rots while CI stays green.
      - name: Install (frozen lock)
        working-directory: mcp-server
        run: uv sync --frozen --extra dev
      - name: Tests
        working-directory: mcp-server
        run: uv run python -m pytest tests/ --tb=short -q
      # An unfixable advisory is waived explicitly with `--ignore-vuln <ID>`,
      # never by loosening --strict.
      - name: Audit the locked resolution
        working-directory: mcp-server
        run: |
          uv export --frozen --no-hashes --no-emit-project --extra dev -o /tmp/mcp-lock-requirements.txt
          uvx pip-audit --strict --no-deps -r /tmp/mcp-lock-requirements.txt
          # pip-audit judges markers for this host, so the Intel-mac fork of the lock
          # (cryptography 48.0.1: no x86_64 wheel after it) is resolved from the same
          # pins and audited too; only its three known cryptography advisories are waived.
          uv pip compile pyproject.toml --extra dev --python-platform x86_64-apple-darwin --python-version 3.12 -c /tmp/mcp-lock-requirements.txt --no-header --no-annotate -q -o /tmp/mcp-lock-darwin-x86_64.txt
          uvx pip-audit --strict --no-deps -r /tmp/mcp-lock-darwin-x86_64.txt --ignore-vuln PYSEC-2026-3552 --ignore-vuln PYSEC-2026-3553 --ignore-vuln PYSEC-2026-3554
      - name: Package builds (keeps it publishable)
        working-directory: mcp-server
        run: uv build --wheel --out-dir /tmp/wheel

  frontend:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Frontend — lint + test + build
    runs-on: ubuntu-latest
    # Same 2026-09-02 measurement: full vitest run does not fit in 20 min here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve copy comparison baseline
        env:
          I18N_COPY_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: |
          # A rewritten push can leave its before commit outside fetched refs.
          if ! git cat-file -e "${I18N_COPY_BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$I18N_COPY_BASE_SHA"
          fi
          git rev-parse --verify "${I18N_COPY_BASE_SHA}^{commit}" >/dev/null
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        # --ignore-scripts: no native postinstall builds are needed for the
        # lint/test/build gates, and it keeps CI from running arbitrary
        # dependency install hooks.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Audit dependencies
        working-directory: frontend
        run: pnpm audit
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Tests
        working-directory: frontend
        env:
          I18N_COPY_BASE_SHA: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: pnpm vitest run
      - name: Asset retention tests
        run: python3 -m unittest discover -s frontend/tests
      - name: Nginx asset and HTML contract
        run: python3 frontend/tests/nginx-integration.py
      - name: Mermaid bundle-isolation checker tests
        working-directory: frontend
        run: node --test scripts/check-mermaid-chunk.test.mjs
      - name: Check generated product documentation
        working-directory: frontend
        run: pnpm docs:check
      - name: Build (typecheck + bundle)
        working-directory: frontend
        run: pnpm build
      - name: Mermaid stays out of eagerly loaded chunks
        working-directory: frontend
        run: pnpm check:mermaid-chunk
      - name: Install deployment-test browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser survives frontend replacement
        run: bash frontend/scripts/test-deployment.sh

  companion:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Companion — source + build contracts (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache-dependency-path: companion/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: companion/desktop/pnpm-lock.yaml
      - name: Go source checks outside the checkout
        timeout-minutes: 15
        env:
          COMPANION_GATE_REPORT_DIR: ${{ runner.temp }}
        run: ./scripts/companion-source-gate.sh go
      - name: Packaging contracts without release credentials
        timeout-minutes: 5
        run: ./scripts/companion-source-gate.sh packaging
      - name: Desktop frontend checks and build
        timeout-minutes: 10
        run: ./scripts/companion-source-gate.sh frontend
      - name: Retain Go test events and skip summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-go-linux-test-events
          path: ${{ runner.temp }}/companion-go.*/*
          if-no-files-found: error
          retention-days: 14
      # Real Beacon, installed-app and signed release qualification are separate.

  companion-rust:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Companion desktop — Rust source contracts (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          cache-dependency-path: companion/desktop/pnpm-lock.yaml
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            companion/desktop/src-tauri/target
          key: companion-cargo-${{ runner.os }}-${{ runner.arch }}-rust1.98.1-${{ hashFiles('companion/desktop/src-tauri/Cargo.lock') }}
      - name: Build frontend and test Rust source contracts
        timeout-minutes: 35
        run: ./scripts/companion-source-gate.sh rust
      # No native integration targets, ignored tests, bundle or updater execution.

  runner:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Runner — go vet + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workloop tests make real `git commit`s in scratch clones, which do not
    # inherit any repo-local identity; hosted runners have no global one.
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@backplane.invalid
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@backplane.invalid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - name: Vet
        working-directory: runner
        run: go vet ./...
      - name: Build
        working-directory: runner
        run: go build ./...
      - name: Tests
        working-directory: runner
        # Integration tests are behind the `integration` build tag and need a
        # live coding-agent CLI on PATH, so they stay out of CI by default.
        run: go test ./...

  runner-artifact:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Runner — artifact recovery gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: astral-sh/setup-uv@v6
      - name: Install fixture dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Qualify binary, real API, recovery and generated MCP through the TUI
        run: ./scripts/runner-artifact-gate.sh

  secrets:
    if: github.repository == 'Valaris-Studio/backplane'
    name: Secrets scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan tracked files
        # Same script contributors run locally, so CI never disagrees with a
        # clean local run. Scans git-tracked files only — see the script header.
        run: ./scripts/scan-secrets.sh
