<text x="76" y="575" fill="#173d2b" font-size="28">Methods, checklists</text>
<text x="76" y="612" fill="#173d2b" font-size="28">and conventions</text></g>
<g><rect x="502" y="472" width="410" height="172" rx="5" fill="#ffffff" stroke="#276b39" stroke-width="2"/>
<path d="M518 488h12m-12 0v12M896 628h-12m12 0v-12" fill="none" stroke="#276b39" stroke-width="2"/>
<text x="530" y="523" fill="#173d2b" font-size="31" font-weight="700">EXECUTION</text>
<text x="884" y="521" fill="#446452" font-size="20" text-anchor="end">Put it to work</text>
