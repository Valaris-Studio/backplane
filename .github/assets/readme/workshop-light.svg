<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title description">
<title id="title">Backplane: a shared workshop for your methodology</title>
<desc id="description">Plans, context, skills, and execution surround a shared workbench for people and agents. Your team decides how the tools work together; no sequence is prescribed.</desc>
