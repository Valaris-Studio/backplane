<text x="884" y="109" fill="#446452" font-size="20" text-anchor="end">The why</text>
<text x="530" y="163" fill="#173d2b" font-size="28">Notes, decisions</text>
<text x="530" y="200" fill="#173d2b" font-size="28">and resources</text></g>
<g><rect x="48" y="472" width="410" height="172" rx="5" fill="#ffffff" stroke="#276b39" stroke-width="2"/>
