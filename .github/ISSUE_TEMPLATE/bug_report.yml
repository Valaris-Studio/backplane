name: Bug report
description: Something isn't working the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't use this form for security
        vulnerabilities — see [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (API / scheduler)
        - Frontend (web app)
        - MCP server
        - Runner (backplane-runner)
        - Docs
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a board with…
        2. Move a card to…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Backend logs, browser console, or runner output. **Redact API keys and tokens.**
      render: shell

  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "commit sha, or output of `git rev-parse --short HEAD`"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Deployment: docker compose / self-hosted / other
        - OS:
        - Coding agent (if runner-related): Claude Code / Codex CLI
        - Git forge (if relevant): GitHub / Gitea
