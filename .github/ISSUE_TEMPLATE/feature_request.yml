name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're stuck in, not the solution you have in mind. This is the most useful part of the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
      description: Including workarounds you're using today.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend (API / scheduler)
        - Frontend (web app)
        - MCP server
        - Runner (backplane-runner)
        - Docs
        - Not sure
