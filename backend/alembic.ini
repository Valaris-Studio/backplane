[alembic]
script_location = alembic
# env.py overrides this at runtime from Settings; kept in sync with the
# compose-published Postgres port (5433) so a bare `alembic upgrade head`
# doesn't point at the wrong place.
sqlalchemy.url = postgresql+asyncpg://valaris:valaris@localhost:5433/valaris

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
