# Gitleaks config for Backplane — secrets gate for CI and the public-export
# pipeline (docs/opensource-consolidation-plan.md, Session 1).
#
# Run locally: scripts/scan-secrets.sh   (works with or without gitleaks installed)
# Install:     brew install gitleaks     (or see https://github.com/gitleaks/gitleaks)

title = "Backplane secrets policy"

[extend]
# Start from gitleaks' curated default ruleset (AWS, GCP, Slack, private keys, …)
useDefault = true

[[rules]]
id = "valaris-api-key"
description = "Backplane/Valaris platform API key (vlr_ prefix)"
# Real keys are `vlr_` + 40+ base64url chars. Placeholders are short or contain
# obvious sentinel words, excluded via the allowlist regexes below.
regex = '''vlr_[A-Za-z0-9_\-]{40,}'''
keywords = ["vlr_"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_\-]{20,}'''
keywords = ["sk-ant"]

# gitleaks 8.30 refuses the legacy single [allowlist] table alongside the
# rule-scoped one below, so both use the [[allowlists]] array form. This entry
# keeps the legacy default: a path OR a sentinel regex suffices.
[[allowlists]]
description = "Placeholders, reference configs, and test fixtures — not real secrets"
# Paths that legitimately contain key-SHAPED strings that are NOT live secrets.
paths = [
  '''.*\.example\..*''',
  '''runner/configs/.*\.docker\..*''',
  # Test suites use key-SHAPED fixtures throughout; real keys never live here.
  '''backend/tests/.*''',
  '''mcp-server/tests/.*''',
  '''frontend/.*__tests__/.*''',
  '''frontend/src/i18n/locales/.*\.json''',
  # Build output, not source.
  '''frontend/dist/.*''',
  # Per-user local state and stale agent worktrees — gitignored, never tracked.
  '''\.claude/.*''',
  # Internal ops docs pending relocation to the private ops repo. The keys they
  # contain were revoked on 2026-07-24 (verified 403) and these paths are in the
  # REMOVE set of docs/public-export-manifest.md, so they never reach the public
  # snapshot. Drop these entries once the relocation lands.
  '''docs/pipeline-design/HANDOVER-.*\.md''',
  '''runner/docs/PLAYBOOK-.*\.md''',
]
# Sentinel placeholder strings that must never trip the gate.
regexes = [
  '''vlr_your[_\-]?(api[_\-]?)?key[_\-]?here''',
  '''vlr_your_agent_key_here''',
  '''vlr_REPLACE.*''',
  '''vlr_(test|other|invalid|secret|fake|dummy|example)[_\-0-9].*''',
  '''vlr_ab12cd34.*''',
  '''\$\{VALARIS_API_KEY\}''',
]

# Rich-capture wire examples carry `content_key` sha256 digests that the
# generic-api-key rule mistakes for keys. Exempt ONLY that rule, ONLY that exact
# line shape, ONLY in the repo-root wire example files: `condition = "AND"`
# needs the path AND the line to match (the default OR would turn either alone
# into a blanket bypass). Every other rule, and any other value, still fires.
[[allowlists]]
description = "rich-capture wire content_key digests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^contracts/rich-capture/wire/(invalid/)?[^/]+\.json$''']
regexTarget = "line"
regexes = ['''^\s*"content_key":\s*"[0-9a-f]{64}",?\s*$''']

# Gitleaks decodes the Minisign file and flags its public key ID in the header.
# Only that known public ID match is exempt, under the exact updater config path.
[[allowlists]]
description = "Companion rotated updater public verification key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^companion/desktop/src-tauri/tauri\.conf\.json$''']
regexTarget = "match"
regexes = ['''^key: C16E8D0247AB4D43$''']
