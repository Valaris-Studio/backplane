[project]
# Distribution + primary command are product-branded (backplane-mcp); the
# valaris_mcp module and the "valaris" MCP namespace are the permanent
# technical namespace — see docs/branding.md.
name = "backplane-mcp"
version = "0.8.0"
description = "MCP server exposing Backplane platform tools for AI agents"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    # <2: mcp 2.0 removed mcp.server.fastmcp; migrating is its own task
    "mcp[cli]>=1.12.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "google-auth>=2.29.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/Valaris-Studio/backplane"
Repository = "https://github.com/Valaris-Studio/backplane.git"
Issues = "https://github.com/Valaris-Studio/backplane/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.scripts]
backplane-mcp = "valaris_mcp.server:main"
# Compat alias — dev tooling (run.sh, docs, in-app reference) invokes this name.
valaris-mcp = "valaris_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valaris_mcp"]

[tool.ruff]
line-length = 99
target-version = "py312"

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "pytest-anyio>=0.0.0",
]
